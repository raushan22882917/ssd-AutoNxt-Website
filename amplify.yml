version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
# SPA client-side routes (e.g. /contribution) must rewrite to index.html
customRedirects:
  - source: "/<*>"
    target: "/index.html"
    status: "200"
